org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# NOTA: o README do kmp-tor-resource ainda manda pôr aqui
# `android.bundle.enableUncompressedNativeLibs=false`. Essa opção foi removida
# no AGP 8.1 e o AGP 9 recusa-se a configurar o projeto se ela estiver presente.
# O que faz o mesmo trabalho — desempacotar o binário do tor para o nativeLibDir
# para poder ser executado — é `packaging { jniLibs.useLegacyPackaging = true }`
# no build.gradle.kts do módulo, que já lá está.
